{% extends 'base.html' %}
{% block title %}Sign Up - MyShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Create an Account</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>
        <p class="mt-3 small">Already have an account? <a href="{% url 'storefront:login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
