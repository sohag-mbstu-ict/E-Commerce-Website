{% extends 'base.html' %}
{% block title %}Order Placed - MyShop{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-check-circle-fill text-success" style="font-size:4rem;"></i>
    <h3 class="mt-3">Thank you! Your order has been placed.</h3>
    <p class="text-muted">Order number: <strong>{{ order.order_number }}</strong></p>
    <a href="{% url 'storefront:order_detail' order.order_number %}" class="btn btn-primary mt-2">View Order</a>
    <a href="{% url 'storefront:product_list' %}" class="btn btn-outline-secondary mt-2">Continue Shopping</a>
</div>
{% endblock %}
